<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Drop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #12121a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: manipulation;
    }
    h1 { margin-bottom: 10px; font-size: 1.8rem; letter-spacing: 2px; color: #00f0f0; }
    .game-container { display: flex; gap: 20px; align-items: flex-start; }
    canvas { background: #0a0a0f; border: 3px solid #2e2e42; border-radius: 4px; }
    .sidebar { display: flex; flex-direction: column; gap: 15px; min-width: 110px; }
    .stat-box { background: #1e1e2e; padding: 12px; border-radius: 6px; text-align: center; }
    .stat-label { font-size: 0.75rem; color: #a0a0b8; text-transform: uppercase; }
    .stat-value { font-size: 1.4rem; font-weight: bold; margin-top: 4px; }
    button {
      background: #00f0f0; color: #0a0a0f; border: none; padding: 10px;
      font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.95rem;
    }
    button:hover { background: #00c8c8; }
    .controls { margin-top: 15px; font-size: 0.85rem; color: #a0a0b8; text-align: center; }
    .mobile-controls { display: none; gap: 8px; margin-top: 15px; }
    @media (max-width: 600px) {
      .mobile-controls { display: flex; flex-wrap: wrap; justify-content: center; max-width: 300px; }
      .mobile-controls button { flex: 1 1 28%; padding: 14px; font-size: 1.1rem; }
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <h1>BLOCK DROP</h1>
  <div class="game-container">
    <canvas id="board" width="240" height="480"></canvas>
    <div class="sidebar">
      <div class="stat-box">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Lines</div>
        <div class="stat-value" id="lines">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Level</div>
        <div class="stat-value" id="level">1</div>
      </div>
      <button id="start-btn">Start / Reset</button>
    </div>
  </div>
  <div class="controls">Arrow Keys: Move & Rotate &bull; Space: Hard Drop</div>
  <div class="mobile-controls">
    <button onclick="playerMove(-1)">◀</button>
    <button onclick="playerRotate(1)">↻</button>
    <button onclick="playerMove(1)">▶</button>
    <button onclick="playerDrop()">▼</button>
    <button onclick="hardDrop()">⤓ Drop</button>
  </div>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    ctx.scale(24, 24);

    const colors = [null, '#00f0f0', '#0000f0', '#f0a000', '#f0f000', '#00f000', '#a000f0', '#f00000'];
    const pieces = 'IJLOSTZ';

    function createPiece(type) {
      if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
      if (type === 'J') return [[0,2,0],[0,2,0],[2,2,0]];
      if (type === 'L') return [[0,3,0],[0,3,0],[0,3,3]];
      if (type === 'O') return [[4,4],[4,4]];
      if (type === 'S') return [[0,5,5],[5,5,0],[0,0,0]];
      if (type === 'T') return [[0,6,0],[6,6,6],[0,0,0]];
      if (type === 'Z') return [[7,7,0],[0,7,7],[0,0,0]];
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) matrix.push(new Array(w).fill(0));
      return matrix;
    }

    let arena = createMatrix(10, 20);
    let player = { pos: {x: 0, y: 0}, matrix: null, score: 0, lines: 0, level: 1 };
    let dropCounter = 0, dropInterval = 1000, lastTime = 0, gameOver = true;

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
        });
      });
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
      }
      dir > 0 ? matrix.forEach(row => row.reverse()) : matrix.reverse();
    }

    function playerReset() {
      player.matrix = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
      player.pos.y = 0;
      player.pos.x = Math.floor(arena[0].length / 2) - Math.floor(player.matrix[0].length / 2);
      if (collide(arena, player)) {
        gameOver = true;
        alert('Game Over! Final Score: ' + player.score);
      }
    }

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) if (arena[y][x] === 0) continue outer;
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        player.score += rowCount * 100 * player.level;
        player.lines += 1;
        rowCount *= 2;
        player.level = Math.floor(player.lines / 10) + 1;
        dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
      }
      updateScore();
    }

    function playerDrop() {
      if (gameOver) return;
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function hardDrop() {
      if (gameOver) return;
      while (!collide(arena, player)) player.pos.y++;
      player.pos.y--;
      merge(arena, player);
      playerReset();
      arenaSweep();
      dropCounter = 0;
    }

    function playerMove(dir) {
      if (gameOver) return;
      player.pos.x += dir;
      if (collide(arena, player)) player.pos.x -= dir;
    }

    function playerRotate(dir) {
      if (gameOver) return;
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = colors[value];
            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
            ctx.lineWidth = 0.05;
            ctx.strokeStyle = '#0a0a0f';
            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    function draw() {
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawMatrix(arena, {x: 0, y: 0});
      if (player.matrix) drawMatrix(player.matrix, player.pos);
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      if (!gameOver) {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) playerDrop();
      }
      draw();
      requestAnimationFrame(update);
    }

    function updateScore() {
      document.getElementById('score').innerText = player.score;
      document.getElementById('lines').innerText = player.lines;
      document.getElementById('level').innerText = player.level;
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      arena = createMatrix(10, 20);
      player.score = 0; player.lines = 0; player.level = 1; dropInterval = 1000;
      gameOver = false;
      updateScore();
      playerReset();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') playerMove(-1);
      else if (e.key === 'ArrowRight') playerMove(1);
      else if (e.key === 'ArrowDown') playerDrop();
      else if (e.key === 'ArrowUp') playerRotate(1);
      else if (e.key === ' ') { e.preventDefault(); hardDrop(); }
    });

    update();
  </script>
</body>
        </html>
